<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260">
<style>
  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .bg { fill: #0d1117; rx: 8px; }
  .text { font-family: 'Courier New', monospace; font-size: 14px; fill: #c9d1d9; }
  .prompt { fill: #58a6ff; font-weight: bold; }
  .key { fill: #7ee787; font-weight: bold; }
  .val { fill: #e6edf3; }
  .line-1 { animation: fadeIn 0.3s ease forwards 0.1s; opacity: 0; }
  .line-2 { animation: fadeIn 0.3s ease forwards 0.25s; opacity: 0; }
  .line-3 { animation: fadeIn 0.3s ease forwards 0.4s; opacity: 0; }
  .line-4 { animation: fadeIn 0.3s ease forwards 0.55s; opacity: 0; }
  .line-5 { animation: fadeIn 0.3s ease forwards 0.7s; opacity: 0; }
  .line-6 { animation: fadeIn 0.3s ease forwards 0.85s; opacity: 0; }
</style>

<rect width="860" height="260" class="bg" />

<g class="text">
  <text x="25" y="35" class="prompt line-1">vanillamaye@github ~ $ neofetch</text>
  <text x="25" y="60" class="line-1">------------------------------------------------------------</text>
  
  <text x="25" y="90" class="line-2"><tspan class="key">Role:</tspan> <tspan class="val">Cloud Engineering &amp; Full-Stack Development</tspan></text>
  <text x="25" y="120" class="line-3"><tspan class="key">Stack:</tspan> <tspan class="val">AWS, Terraform, Docker, Node.js, Python, Laravel</tspan></text>
  <text x="25" y="150" class="line-4"><tspan class="key">Focus:</tspan> <tspan class="val">Serverless Architecture &amp; DevOps Pipelines</tspan></text>
  <text x="25" y="180" class="line-5"><tspan class="key">Portfolio:</tspan> <tspan class="val">marielle.github.io</tspan></text>

  <g class="line-6">
    <circle cx="35" cy="220" r="7" fill="#ff7b72" />
    <circle cx="58" cy="220" r="7" fill="#7ee787" />
    <circle cx="81" cy="220" r="7" fill="#d2a8ff" />
    <circle cx="104" cy="220" r="7" fill="#79c0ff" />
    <circle cx="127" cy="220" r="7" fill="#ffa657" />
  </g>
</g>
</svg>
